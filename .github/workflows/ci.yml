name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit and Storybook tests
        run: npm test

      - name: Build app
        run: npm run build
