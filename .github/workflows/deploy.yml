name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to S3
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::991049544436:role/OdinGithubRole

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://odin-smr-ui --delete

      - name: Look up CloudFront distribution ID by domain name
        id: get_distribution
        run: |
          export DIST_ID=$(aws cloudfront list-distributions | jq -r '.DistributionList.Items[] | select(.Aliases.Items[]? == "odin-smr.org") | .Id')
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html"

