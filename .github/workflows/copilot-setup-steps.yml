on: workflow_dispatch
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci
